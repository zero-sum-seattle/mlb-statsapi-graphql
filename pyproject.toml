[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlb-statsapi-graphql"
version = "0.1.0"
description = "A small GraphQL API powered by python-mlb-statsapi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "strawberry-graphql[fastapi]>=0.335.0,<1",
  "graphql-core>=3.3.0,<3.4",
  "uvicorn>=0.30,<1",
  "python-mlb-statsapi[async]>=1.1.2,<1.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
